# Materia configuration. Placeholder values, filled in as tasks land.

# Fraction of a declared output's value a correction must move for a finding
# to be shown. docs/ARCHITECTURE.md section 7. T21 implements the gate.
materiality:
  threshold: 0.01

# Provider selection. MATERIA_PROVIDER overrides "name" at startup. The
# provider that produced a results/ directory is recorded alongside it, so a
# dev loop run cannot be mistaken for a scored one. T12.
provider:
  name: groq
  models:
    groq: openai/gpt-oss-120b
    openai: gpt-5.6-terra

# Per workbook run budgets. The baseline's caps are set equal to the
# solution's measured per workbook average, so neither side gets more room
# than the other. docs/EVALUATION.md section 4.
#
# Derived, not chosen. Measured on gpt-5.6-terra: 3.0 model calls and 9,463
# tokens per candidate. The corpus averages 22.2 candidates per workbook, so
# the solution spends about 67 calls and 211,000 tokens on one workbook, and
# the baseline is given the same.
solution:
  calls_per_candidate: 3.0
  tokens_per_candidate: 9463

baseline:
  max_turns: 67
  max_tokens: 211000

# Corpus generation. docs/REPRODUCTION.md section 9.
corpus:
  seed: 20260828
  workbooks: 12
