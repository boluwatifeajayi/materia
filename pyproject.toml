[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "materia"
version = "0.1.0"
description = "Impact verified auditing for spreadsheet financial models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    # Exact pin, not a floor. openpyxl decides the XML that lands in the
    # generated workbooks, so a different version changes their bytes and
    # breaks the corpus/checksums.txt committed in T08.
    "openpyxl==3.1.5",
    "networkx>=3.2",
    "anthropic>=0.39",
    "openai>=1.50",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
materia = "materia.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
